    <header>
        <h1>Веб - технологии</h1>
        <h2>Университет "Дубна"</h2>
        <h3>Есть вопросы?</h3>
    </header>
    <form>
        <div>
            <label for "question">Как Вам удобно получить ответ:</label>
            <input type="radio" name="question" value="email id="question1" checked>
            <label for="email">по почте</label>
            <input type="radio" name="question" value="phone" id="question2">
            <label for="phone">по телефону</label>
            <input type="radio" name="question" value="outher" id="question3">
            <label for="outher">не нужно отвечать</label>
        </div>
        <div>
            <label for "question">Укажите тему вопроса</label>
            <select name="category" id="user_category">>
            <option value="work">Работа</option>
            <option value="family">Семья</option>
            <option value="uni-dubna">Университет</option>
            <option value="business">Коммерческое предложение</option>
            <option value="family">Семья</option>
            <option value="other_questions">Другие вопросы</option>
            </select>
        </div>
        <div>
            <label for "question">И ещё один вопрос</label>
            <input type="checkbox" id="checkbox" name="checkbox">
            <label for="checkbox">может так</label>
            <input type="checkbox" id="checkbox1" name="checkbox">
            <label for="checkbox1">или не так</label>
            <input type="checkbox" id="checkbox2" name="checkbox">
            <label for="checkbox2">иначе</label>
        </div>
        <div>
            <label for "name">Ваше имя</label>
            <input type="text" name="name" id="user_name">
        </div>
        <div>
            <label for "email">Адрес почты</label>
            <input type="text" name="email" id="user_email">
        </div>
        <div>
            <label for "phone">Номер телефона</label>
            <input type="text" name="phone" id="user_phone">
        </div>
        <div>
            <label for "message">Сообщение:</label><br>
            <textarea name="message" id="user_message" cols="30" rows="5"></textarea>
        </div>
        <div>
            <input type="submit" value="Отправить">
        </div>




    </form>
